<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CareerConnect</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <script src="login.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">CareerConnect</a>
        <div>
            <a href="index.html">Home</a>
            <a href="employer.html">For Employers</a>
        </div>
    </nav>

    <main class="auth-container">
        <section class="auth-card">
            <h1>Welcome Back!</h1>
            <p>Log in to your CareerConnect account.</p>

            <form id="login-form">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" required
                       placeholder="you@example.com">

                <label for="login-password">Password</label>
                <input type="password" id="login-password" required
                       placeholder="Enter your password">

                <label for="login-role">I am a</label>
                <select id="login-role" required>
                    <option value="candidate">Candidate</option>
                    <option value="employer">Employer</option>
                </select>

                <button type="submit" class="auth-button">Log In</button>
                <p id="login-message" role="status"></p>
            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </p>
        </section>
    </main>
</body>
</html>
